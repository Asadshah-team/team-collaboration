<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="LMS Logo" class="logo">
        <button class="logout" onclick="logout()" style="display: none;">Logout</button>
    </header>
    <main>
        <section id="loginSection" class="section active">
            <img src="images/login-bg.jpg" alt="Login Background" class="section-bg">
            <div class="form-container">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <input type="email" id="email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <img src="images/eye-off.png" alt="Show Password" class="eye-icon">
                        </button>
                    </div>
                    <div class="input-group">
                        <select id="userRole" required>
                            <option value="" disabled selected>Select Role</option>
                            <option value="admin">Admin</option>
                            <option value="teacher">Teacher</option>
                            <option value="student">Student</option>
                        </select>
                    </div>
                    <p id="loginError" class="error-message" style="display: none;"></p>
                    <button type="submit">Login</button>
                </form>
            </div>
        </section>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
